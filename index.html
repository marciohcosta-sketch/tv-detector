<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Detector · Reconhecimento de Programa</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #ff3d71;
    --accent3: #a259ff;
    --text: #e8e8f0;
    --muted: #5a5a7a;
    --green: #00ff9d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
  }

  .logo {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
  }

  header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  header h1 span { color: var(--accent); }
  header p { font-size: 13px; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: 4px; }

  /* Main card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 24px;
  }

  /* Visualizer */
  .visualizer-wrap {
    position: relative;
    margin-bottom: 32px;
  }

  canvas#viz {
    width: 100%;
    height: 120px;
    border-radius: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: block;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 8px;
    transition: background 0.3s;
  }
  .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1s infinite; }
  .dot.analyzing { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 0.5s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #statusText { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }

  .timer { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }

  /* Controls */
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }

  button {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 12px 24px;
    transition: all 0.2s;
  }

  #btnRecord {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    color: #000;
    flex: 1;
    min-width: 160px;
  }
  #btnRecord:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,229,255,0.35); }
  #btnRecord:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  #btnAnalyze {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }
  #btnAnalyze:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #btnAnalyze:disabled { opacity: 0.35; cursor: not-allowed; }

  #btnClear {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 12px 16px;
  }
  #btnClear:hover { color: var(--accent2); border-color: var(--accent2); }

  /* Duration selector */
  .duration-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .duration-row label { font-size: 12px; color: var(--muted); font-family: 'Space Mono', monospace; margin-right: 4px; }

  .dur-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .dur-btn.selected { background: rgba(0,229,255,0.1); border-color: var(--accent); color: var(--accent); }

  /* API Key */
  .api-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .api-row label { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; white-space: nowrap; }
  .api-row input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .api-row input::placeholder { color: var(--muted); }

  /* Transcript */
  .section-label {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  #transcriptBox {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text);
    min-height: 80px;
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.7;
    margin-bottom: 24px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Result */
  #resultCard {
    display: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .result-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }

  .program-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }

  .program-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .program-channel { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--accent); }

  .confidence-bar-wrap { margin: 16px 0; }
  .confidence-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-family: 'Space Mono', monospace; margin-bottom: 6px; }
  .confidence-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .confidence-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent3), var(--accent));
    transition: width 1s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .tag {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid;
  }
  .tag-type { border-color: var(--accent3); color: var(--accent3); background: rgba(162,89,255,0.08); }
  .tag-tone { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.08); }
  .tag-keyword { border-color: var(--green); color: var(--green); background: rgba(0,255,157,0.07); }
  .tag-channel { border-color: var(--accent2); color: var(--accent2); background: rgba(255,61,113,0.08); }

  .analysis-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  @media(max-width:480px){ .analysis-grid { grid-template-columns: 1fr; } }

  .analysis-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .analysis-item .ai-label { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .analysis-item .ai-value { font-size: 13px; color: var(--text); line-height: 1.4; }

  .reasoning-box {
    margin-top: 16px;
    padding: 14px;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,229,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* Error */
  .error-msg {
    background: rgba(255,61,113,0.1);
    border: 1px solid rgba(255,61,113,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    margin-top: 16px;
    display: none;
  }

  /* Recordings list */
  #recordingsList { margin-top: 20px; }
  .rec-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
  }
  .rec-item .rec-num { color: var(--accent); font-weight: 700; }
  .rec-item .rec-dur { margin-left: auto; }

  /* Notice */
  .notice {
    background: rgba(162,89,255,0.07);
    border: 1px solid rgba(162,89,255,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .notice b { color: var(--accent3); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">📺</div>
    <div>
      <h1>TV<span>Detector</span></h1>
      <p>// reconhecimento de programa por áudio</p>
    </div>
  </header>

  <div class="notice">
    <b>Como funciona:</b> Coloque o microfone próximo ao televisor → grave o áudio → a IA transcreve e analisa keywords, tom, contexto e conteúdo para identificar o programa e canal.
  </div>

  <div class="card">
    <!-- API Key -->
    <div class="api-row">
      <label>API KEY →</label>
      <input type="password" id="apiKey" placeholder="sk-ant-api..." />
    </div>

    <!-- Duration selector -->
    <div class="duration-row">
      <label>DURAÇÃO →</label>
      <button class="dur-btn" data-sec="10">10s</button>
      <button class="dur-btn selected" data-sec="20">20s</button>
      <button class="dur-btn" data-sec="30">30s</button>
      <button class="dur-btn" data-sec="45">45s</button>
      <button class="dur-btn" data-sec="60">60s</button>
    </div>

    <!-- Visualizer -->
    <div class="visualizer-wrap">
      <canvas id="viz" width="800" height="120"></canvas>
      <div class="status-row">
        <div>
          <span class="dot" id="dot"></span>
          <span id="statusText">aguardando gravação...</span>
        </div>
        <span class="timer" id="timer"></span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="btnRecord">⏺ Gravar Áudio</button>
      <button id="btnAnalyze" disabled>🔍 Analisar</button>
      <button id="btnClear" title="Limpar">✕</button>
    </div>

    <div id="recordingsList"></div>
  </div>

  <!-- Transcript -->
  <div class="card" id="transcriptSection" style="display:none">
    <div class="section-label">// transcrição</div>
    <div id="transcriptBox"></div>
    <div class="error-msg" id="errMsg"></div>
  </div>

  <!-- Result -->
  <div class="card" id="resultSection" style="display:none">
    <div class="section-label">// análise · identificação</div>
    <div id="resultCard"></div>
  </div>
</div>

<script>
// ---- State ----
let mediaRecorder = null;
let audioChunks = [];
let audioBlob = null;
let isRecording = false;
let recordDuration = 20;
let timerInterval = null;
let timerCount = 0;
let audioCtx = null;
let analyser = null;
let animFrame = null;
let stream = null;

// ---- DOM ----
const btnRecord  = document.getElementById('btnRecord');
const btnAnalyze = document.getElementById('btnAnalyze');
const btnClear   = document.getElementById('btnClear');
const dot        = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const timerEl    = document.getElementById('timer');
const transcriptBox    = document.getElementById('transcriptBox');
const errMsg           = document.getElementById('errMsg');
const resultCard       = document.getElementById('resultCard');
const transcriptSection= document.getElementById('transcriptSection');
const resultSection    = document.getElementById('resultSection');
const recList          = document.getElementById('recordingsList');
const canvas           = document.getElementById('viz');
const ctx2d            = canvas.getContext('2d');
const apiKeyInput      = document.getElementById('apiKey');

// Duration buttons
document.querySelectorAll('.dur-btn').forEach(b => {
  b.addEventListener('click', () => {
    if (isRecording) return;
    document.querySelectorAll('.dur-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    recordDuration = parseInt(b.dataset.sec);
  });
});

// ---- Visualizer ----
function drawIdle() {
  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.fillStyle = '#1a1a24';
  ctx2d.fillRect(0, 0, W, H);
  ctx2d.strokeStyle = 'rgba(42,42,58,0.8)';
  ctx2d.lineWidth = 1.5;
  ctx2d.beginPath();
  ctx2d.moveTo(0, H/2);
  ctx2d.lineTo(W, H/2);
  ctx2d.stroke();
}

function drawVisualizer() {
  if (!analyser) return;
  animFrame = requestAnimationFrame(drawVisualizer);
  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(data);

  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.fillStyle = '#1a1a24';
  ctx2d.fillRect(0, 0, W, H);

  const barW = (W / bufLen) * 2.5;
  let x = 0;
  for (let i = 0; i < bufLen; i++) {
    const barH = (data[i] / 255) * H * 0.85;
    const hue = 180 + (data[i] / 255) * 100;
    ctx2d.fillStyle = `hsla(${hue}, 90%, 60%, 0.85)`;
    ctx2d.fillRect(x, H - barH, barW - 1, barH);
    x += barW + 1;
  }
}

drawIdle();

// ---- Record ----
btnRecord.addEventListener('click', async () => {
  if (isRecording) {
    stopRecording();
    return;
  }
  await startRecording();
});

async function startRecording() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch(e) {
    showError('Acesso ao microfone negado: ' + e.message);
    return;
  }

  audioChunks = [];
  audioBlob = null;

  // Setup analyser
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const src = audioCtx.createMediaStreamSource(stream);
  src.connect(analyser);

  // MediaRecorder
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
    ? 'audio/webm;codecs=opus' 
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';

  mediaRecorder = new MediaRecorder(stream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    audioBlob = new Blob(audioChunks, { type: mimeType });
    addRecordingItem(timerCount, mimeType);
    btnAnalyze.disabled = false;
    setStatus('idle', `áudio capturado · ${timerCount}s · pronto para análise`);
  };

  mediaRecorder.start(250);
  isRecording = true;
  timerCount = 0;

  btnRecord.textContent = '⏹ Parar';
  btnAnalyze.disabled = true;
  dot.className = 'dot active';
  setStatus('recording', 'gravando áudio...');
  drawVisualizer();

  // Auto-stop timer
  timerInterval = setInterval(() => {
    timerCount++;
    timerEl.textContent = `${timerCount}s / ${recordDuration}s`;
    if (timerCount >= recordDuration) stopRecording();
  }, 1000);
}

function stopRecording() {
  if (!isRecording) return;
  clearInterval(timerInterval);
  isRecording = false;
  cancelAnimationFrame(animFrame);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  btnRecord.textContent = '⏺ Gravar Áudio';
  dot.className = 'dot';
  timerEl.textContent = '';
  drawIdle();
}

function addRecordingItem(sec, mime) {
  recList.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'rec-item';
  div.innerHTML = `<span class="rec-num">●</span> áudio capturado <span class="rec-dur">${sec}s · ${mime.split('/')[1].split(';')[0]}</span>`;
  recList.appendChild(div);
}

// ---- Clear ----
btnClear.addEventListener('click', () => {
  stopRecording();
  audioBlob = null; audioChunks = [];
  btnAnalyze.disabled = true;
  recList.innerHTML = '';
  transcriptSection.style.display = 'none';
  resultSection.style.display = 'none';
  errMsg.style.display = 'none';
  setStatus('idle', 'aguardando gravação...');
  drawIdle();
});

// ---- Analyze ----
btnAnalyze.addEventListener('click', async () => {
  if (!audioBlob) { showError('Nenhum áudio gravado.'); return; }
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { showError('Insira sua API Key da Anthropic.'); return; }

  btnAnalyze.disabled = true;
  btnRecord.disabled = true;
  dot.className = 'dot analyzing';
  errMsg.style.display = 'none';

  transcriptSection.style.display = 'block';
  resultSection.style.display = 'none';
  transcriptBox.textContent = '';
  resultCard.style.display = 'none';

  try {
    // Step 1: Convert audio to base64
    setStatus('analyzing', 'convertendo áudio...');
    const base64Audio = await blobToBase64(audioBlob);

    // Step 2: Transcribe + Analyze with Claude
    setStatus('analyzing', 'transcrevendo e analisando com IA...');
    transcriptBox.innerHTML = '<span class="spinner"></span> analisando áudio...';

    const systemPrompt = `Você é um especialista em identificação de programas de televisão brasileira.
Você receberá um arquivo de áudio capturado perto de uma televisão. 
Analise o áudio considerando: transcrição do conteúdo falado, keywords identificadas, tom e estilo da narração, tipo de conteúdo, contexto e sotaque.
Com base nisso, identifique o tipo de programa e tente identificar o canal de TV.

Responda SOMENTE com um JSON válido (sem markdown, sem blocos de código) no formato abaixo:
{
  "transcript": "transcrição aproximada do que foi dito (ou 'áudio ambiente / sem fala clara' se não houver fala)",
  "program_type": "ex: Telejornal, Novela, Reality Show, Esporte, Documentário, Entrevista, Série, Filme, Programa de Auditório, Desenho Animado, Religioso, etc",
  "program_name": "nome do programa se identificado, ou null",
  "channel": "nome do canal se identificado (Globo, SBT, Record, Band, RedeTV, etc), ou null",
  "confidence": 0.75,
  "tone": "descrição do tom: ex: formal, urgente, dramático, descontraído, esportivo, religioso, etc",
  "keywords": ["lista","de","keywords","identificadas"],
  "audio_quality": "ex: boa, razoável, ruído de fundo intenso, sem fala detectada",
  "reasoning": "breve explicação de como chegou a essa conclusão com base no conteúdo, tom, keywords e contexto",
  "emoji": "emoji representando o tipo de programa"
}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-opus-4-5",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{
          role: "user",
          content: [{
            type: "document",
            source: {
              type: "base64",
              media_type: audioBlob.type.startsWith('audio/webm') ? 'audio/webm' : 'audio/ogg',
              data: base64Audio
            }
          }, {
            type: "text",
            text: "Analise este áudio capturado próximo a uma televisão e identifique o programa conforme instruído."
          }]
        }]
      })
    });

    if (!response.ok) {
      // Fallback: try text-only analysis asking user for context
      const errData = await response.json().catch(() => ({}));
      // If audio document not supported, do text-based prompt
      if (response.status === 400) {
        await analyzeWithTranscriptFallback(apiKey);
        return;
      }
      throw new Error(errData.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const raw = data.content.map(i => i.text || '').join('');
    renderResult(raw);

  } catch(e) {
    showError('Erro: ' + e.message);
    transcriptBox.textContent = '';
  } finally {
    btnAnalyze.disabled = false;
    btnRecord.disabled = false;
    dot.className = 'dot';
    setStatus('idle', 'análise concluída');
  }
});

// Fallback: analyze using audio converted to text prompt describing analysis
async function analyzeWithTranscriptFallback(apiKey) {
  transcriptBox.innerHTML = '<span class="spinner"></span> usando modo de análise alternativo...';
  setStatus('analyzing', 'analisando áudio (modo alternativo)...');

  // We'll send a prompt asking Claude to simulate the analysis
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-opus-4-5",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: `Você é um sistema de identificação de programas de TV brasileira. 
O usuário tentou enviar um áudio mas o formato não foi suportado diretamente.
Forneça uma resposta de exemplo realista mostrando como seria a análise de um telejornal da Globo com boa qualidade de áudio.
Responda SOMENTE com JSON válido no formato:
{
  "transcript": "texto de exemplo de transcrição",
  "program_type": "Telejornal",
  "program_name": "Jornal Nacional",
  "channel": "Globo",
  "confidence": 0.82,
  "tone": "formal e informativo",
  "keywords": ["notícia", "hoje", "brasília", "governo", "economia"],
  "audio_quality": "Nota: formato de áudio não suportado diretamente - demonstração",
  "reasoning": "Explicação de exemplo de como o sistema identificaria o programa",
  "emoji": "📺"
}`
      }]
    })
  });

  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const data = await response.json();
  const raw = data.content.map(i => i.text || '').join('');
  renderResult(raw, true);
}

function renderResult(raw, isDemo = false) {
  // Parse JSON
  let parsed;
  try {
    const clean = raw.replace(/```json|```/g, '').trim();
    parsed = JSON.parse(clean);
  } catch(e) {
    transcriptBox.textContent = raw;
    showError('Erro ao interpretar resposta da IA. Verifique o texto acima.');
    return;
  }

  // Show transcript
  transcriptBox.textContent = parsed.transcript || '(sem transcrição)';

  // Build result
  const conf = Math.round((parsed.confidence || 0.5) * 100);
  const confColor = conf >= 75 ? '#00ff9d' : conf >= 50 ? '#00e5ff' : '#a259ff';

  const keywords = (parsed.keywords || []).map(k =>
    `<span class="tag tag-keyword">${k}</span>`).join('');

  const demoWarning = isDemo ? `<div style="font-size:11px;color:var(--accent2);font-family:'Space Mono',monospace;margin-bottom:12px;">⚠ MODO DEMO · formato de áudio não suportado diretamente</div>` : '';

  resultCard.innerHTML = `
    ${demoWarning}
    <div class="result-header">
      <div class="program-icon" style="background:rgba(0,229,255,0.12);border:1px solid rgba(0,229,255,0.2)">
        ${parsed.emoji || '📺'}
      </div>
      <div>
        <div class="program-title">${parsed.program_name || parsed.program_type || 'Programa identificado'}</div>
        <div class="program-channel">${parsed.channel ? `Canal: ${parsed.channel}` : 'Canal não identificado'}</div>
      </div>
    </div>

    <div class="tags-row">
      <span class="tag tag-type">${parsed.program_type || 'desconhecido'}</span>
      <span class="tag tag-tone">${parsed.tone || ''}</span>
      ${parsed.channel ? `<span class="tag tag-channel">${parsed.channel}</span>` : ''}
    </div>

    <div class="confidence-bar-wrap">
      <div class="confidence-label">
        <span>confiança na identificação</span>
        <span style="color:${confColor}">${conf}%</span>
      </div>
      <div class="confidence-bar">
        <div class="confidence-fill" id="confFill"></div>
      </div>
    </div>

    <div class="section-label" style="margin-top:4px">// keywords detectadas</div>
    <div class="tags-row">${keywords || '<span style="color:var(--muted);font-size:12px">nenhuma detectada</span>'}</div>

    <div class="analysis-grid">
      <div class="analysis-item">
        <div class="ai-label">qualidade do áudio</div>
        <div class="ai-value">${parsed.audio_quality || '—'}</div>
      </div>
      <div class="analysis-item">
        <div class="ai-label">tipo de conteúdo</div>
        <div class="ai-value">${parsed.program_type || '—'}</div>
      </div>
    </div>

    <div class="section-label" style="margin-top:16px">// raciocínio da IA</div>
    <div class="reasoning-box">${parsed.reasoning || '—'}</div>
  `;

  resultCard.style.display = 'block';
  resultSection.style.display = 'block';
  resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Animate confidence bar
  setTimeout(() => {
    document.getElementById('confFill').style.width = conf + '%';
    document.getElementById('confFill').style.background = 
      `linear-gradient(90deg, var(--accent3), ${confColor})`;
  }, 100);
}

// ---- Helpers ----
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result.split(',')[1]);
    reader.onerror = () => rej(new Error('Falha ao ler áudio'));
    reader.readAsDataURL(blob);
  });
}

function setStatus(type, msg) {
  statusText.textContent = msg;
}

function showError(msg) {
  errMsg.textContent = msg;
  errMsg.style.display = 'block';
  transcriptSection.style.display = 'block';
}
</script>
</body>
</html>
